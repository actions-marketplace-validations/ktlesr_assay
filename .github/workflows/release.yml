# Yayın hattı. İki tetikleyici, iki farklı iş:
#
#   push (main)        → yalnızca sürüm hazırlığı. Changeset varsa "Version
#                        Packages" PR'ı açılır veya tazelenir. HİÇBİR KOŞULDA
#                        yayımlamaz.
#   workflow_dispatch  → yayın. npm'de bulunmayan sürümleri gönderir.
#
# Yayının ayrı ve elle bir tetikleyici olması kasıtlı. Alternatifi —
# "changeset kalmadıysa yayımla" — main'e atılan HER commit'i bir yayın
# denemesine çevirir; belge düzelten bir commit bile. npm yayını geri
# alınamaz, o yüzden tetiği çekmek açık bir eylem olmalı.
#
# Kimlik doğrulama trusted publishing (OIDC) ile. Saklanan token yok: npm,
# GitHub'ın verdiği kısa ömürlü ve bu iş akışına özgü kimliği doğruluyor.
# Yenilenecek bir secret olmadığı için 90 günlük token döngüsü de yok.
#
# Depo public olduğu için provenance üretiliyor: yayımlanan her tarball'a,
# hangi commit'ten hangi iş akışıyla derlendiğini söyleyen imzalı bir kanıt
# ekleniyor. npm paket sayfasında doğrulanabiliyor.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Yayımlamak için 'yayimla' yaz"
        required: true
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      publishing: ${{ steps.mode.outputs.publishing }}
    steps:
      # Yayın yalnızca elle tetiklendiğinde ve onay yazıldığında yapılır.
      # Yanlış yazılan onay sessizce sürüm hazırlığına düşmesin diye burada
      # durduruluyor.
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm }}" != "yayimla" ]; then
              echo "::error::Onay metni 'yayimla' değil — yayın yapılmadı."
              exit 1
            fi
            echo "publishing=true" >> "$GITHUB_OUTPUT"
            echo "mod: YAYIN"
          else
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            echo "mod: yalnızca sürüm hazırlığı (push)"
          fi

  release:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write # sürüm PR'ı ve etiketi
      pull-requests: write
      id-token: write # npm provenance: Sigstore'a OIDC ile kimlik kanıtı
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changesets değişen paketleri bulmak için geçmişi ister

      # Sürüm package.json'daki `packageManager` alanından okunuyor. Burada
      # `version:` de vermek action'ı "Multiple versions of pnpm specified"
      # hatasıyla düşürüyor — tek doğruluk kaynağı `packageManager`.
      - uses: pnpm/action-setup@v4

      # DİKKAT: `registry-url` verilmiyor. Verilince setup-node bir .npmrc
      # yazıp içine `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # koyuyor; token'sız hatta bu satır BOŞ bir kimlik bilgisine çözülüyor
      # ve npm "zaten kimlik var" sanıp trusted publishing (OIDC) değişimini
      # hiç denemiyor. Sonuç: kimlik bilgisiz PUT ve E404. Registry varsayılanı
      # zaten registry.npmjs.org.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing (OIDC) npm >= 11.5.1 ister; Node 22 ile gelen npm
      # 10.9.x bunu YAPMAZ. 0.1.0 aslında NODE_AUTH_TOKEN ile yayımlanmıştı,
      # OIDC ile değil; token çıkarılınca hatta hiç kimlik bilgisi kalmadı ve
      # 0.1.1 iki kez E404 ile düştü. Kimlik bilgisiz PUT 404 döner, 401 değil.
      - name: npm sürümü trusted publishing için yeterli mi
        if: needs.guard.outputs.publishing == 'true'
        run: |
          npm install -g npm@latest
          v=$(npm --version)
          echo "npm $v"
          if ! { echo 11.5.1; echo "$v"; } | sort -V -C; then
            echo "::error::npm $v trusted publishing desteklemiyor (>= 11.5.1 gerekli). Yayın durduruldu."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Prisma istemcisi repoda tutulmuyor (üretilen kod); typecheck ona bağlı.
      - run: pnpm --filter @ktlsr/assay-db exec prisma generate

      # Yayımlanan bir sürüm geri alınamaz: kontroller publish'ten ÖNCE koşar.
      # Paketlerin kendi prepublishOnly'si de aynı kontrolü koşar; burada
      # tekrarlanması, hata durumunda npm'e hiç ulaşılmamasını garanti eder.
      - run: pnpm check

      # Tarball'a test dosyası, source map veya kaynak sızmadığını kanıtlar.
      - run: pnpm pack:check

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          # Boş `publish`, action'ı yalnızca sürüm hazırlığı moduna sokar.
          # Yayın komutu yalnızca elle tetiklenen koşumda doluyor.
          publish: ${{ needs.guard.outputs.publishing == 'true' && 'pnpm release' || '' }}
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # NPM_TOKEN bilerek verilmiyor: changesets/action token bulamayınca
          # OIDC'ye düşüyor ve trusted publishing kullanıyor.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Aracın "yayımladım" demesi bir iddia; registry'den okumak kanıt. Bu
      # projenin adaptörü de host'un başarı bildirimine aynı sebeple güvenmiyor.
      #
      # Koşul changesets'in `published` çıktısına DEĞİL, yayın moduna bağlı:
      # kendi yayın komutumuzu kullandığımız için action çıktıyı ayrıştıramıyor
      # ve bayrağı `false` bırakıyor. 0.1.0'da bu yüzden doğrulama sessizce
      # atlandı — paketler gitmişti ama kimse kontrol etmemişti.
      - name: yayımlanan sürümler registry'de görünüyor mu
        if: needs.guard.outputs.publishing == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node tools/verify-published.mjs
