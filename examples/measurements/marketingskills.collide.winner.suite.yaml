  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:cold-email
    not_triggered:
    - marketing-skills:emails
    - marketing-skills:copywriting
- id: collide.seo_audit.not_found
  prompt: Nobody finds blog/how-to-meter-api-usage.html when they search for the topic, even
    though it answers it well. Figure out why.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
