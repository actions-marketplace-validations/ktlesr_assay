    - marketing-skills:paywalls
- id: trigger.negative.near_neighbor.form_crash
  prompt: register.html throws "Cannot read properties of null (reading 'value')" as soon
    as the page loads. Fix the crash. Nothing visible changes.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    triggered: false
    winner: none
    not_triggered:
