# DERIVED — for re-scoring only (Assay 0.4.0-f).
#
# Source: skill-trigger-measurements, suites/marketingskills.collide.suite.yaml
# (version 2), the suite behind run-2026-09-10T11-01-34-914Z-0bec859e.
#
# The source suite could only say which skills must NOT fire, so a run where
# nothing fired passed; the expected winner lived in the case id and was read
# back by tools/collide.py. This copy moves that id-encoded winner into
# `expect.winner`, one rule per case kind, exactly as collide.py's expected():
#
#   collide.<skill>.*      -> winner: marketing-skills:<skill>  ("_" -> "-")
#   contested.copywriting.* -> winner: [copywriting, copy-editing], and its
#                              not_triggered [copy-editing] is dropped. The
#                              source suite's own comment says contested cases
#                              are ones "two descriptions both claim"; the
#                              not_triggered contradicted that, and was the only
#                              way 0.3.2 could make the case measure anything.
#                              collide.py left it unscored.
#   trigger.negative.*     -> winner: none, alongside triggered: false
#
# Case ids are kept byte-for-byte: re-scoring matches record cases by id.
# Prompts, fixtures and not_triggered are unchanged. The fixtures path is
# relative to the measurement repository; to run this suite rather than
# re-score with it, place it in that repository's suites/ directory.
#
#   node tools/rescore.mjs <run.json> examples/measurements/marketingskills.collide.winner.suite.yaml

version: 2
target:
  skill: marketing-skills:product-marketing
  source: coreyhaines31/marketingskills@5b2c0007766c6a1cf1d53fd8fc73e979e0821022
environment:
  host: claude-code
  model: claude-haiku-4-5-20251001
  system_prompt_hash: not-provided-by-host
  active_skills:
  - marketing-skills:cro
  - marketing-skills:signup
  - marketing-skills:onboarding
  - marketing-skills:popups
  - marketing-skills:paywalls
  - marketing-skills:copywriting
  - marketing-skills:copy-editing
  - marketing-skills:emails
  - marketing-skills:cold-email
  - marketing-skills:seo-audit
  - marketing-skills:ai-seo
  - marketing-skills:programmatic-seo
  - marketing-skills:schema
  - marketing-skills:product-marketing
runs: 10
cases:
- id: collide.signup.registration_form
  prompt: Half the people who open register.html never finish creating their account. Figure
    out why and fix the form.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:signup
    not_triggered:
    - marketing-skills:cro
    - marketing-skills:onboarding
    - marketing-skills:popups
- id: collide.cro.lead_form
  prompt: The newsletter form in the footer of index.html barely gets any submissions. Get
    more people to fill it in.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:cro
    not_triggered:
    - marketing-skills:signup
    - marketing-skills:popups
    - marketing-skills:emails
- id: collide.popups.exit_modal_wording
  prompt: Rewrite the words in components/exit-modal.html - it is the thing that appears when
    someone moves to close the tab. Nobody engages with it.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:popups
    not_triggered:
    - marketing-skills:copywriting
    - marketing-skills:copy-editing
    - marketing-skills:cro
- id: collide.popups.exit_modal_timing
  prompt: components/exit-modal.html shows up three seconds after page load for every visitor.
    Work out when and to whom it should appear instead.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:popups
    not_triggered:
    - marketing-skills:cro
- id: collide.cro.pricing_page
  prompt: pricing.html gets plenty of visits but almost nobody clicks through to buy. What
    is wrong with the page and what should change?
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:cro
    not_triggered:
    - marketing-skills:paywalls
    - marketing-skills:copywriting
- id: collide.paywalls.limit_screen
  prompt: app/limit-reached.html is what a free user sees after their 1,000th metered call.
    Very few of them upgrade from it. Rework it.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:paywalls
    not_triggered:
    - marketing-skills:cro
    - marketing-skills:popups
- id: collide.onboarding.first_session
  prompt: People create an account, land on app/welcome.html, look at an empty dashboard and
    never come back. Fix what they see in that first session.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:onboarding
    not_triggered:
    - marketing-skills:signup
    - marketing-skills:emails
- id: contested.copywriting.headline_better
  prompt: Write a better headline for the hero in index.html.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner:
    - marketing-skills:copywriting
    - marketing-skills:copy-editing
- id: collide.copy_editing.tighten_paragraph
  prompt: The About paragraph in index.html is wordy and has two typos. Tighten it up without
    changing what it says.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:copy-editing
    not_triggered:
    - marketing-skills:copywriting
- id: collide.emails.welcome_sequence
  prompt: messages/welcome-sequence.md is the draft of what we send in the first week after
    someone creates an account. Plan it properly - how many messages, when, and what each
    one does.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    winner: marketing-skills:emails
    not_triggered:
    - marketing-skills:onboarding
    - marketing-skills:cold-email
    - marketing-skills:copywriting
- id: collide.cold_email.outreach
  prompt: outreach/prospects.csv lists platform leads at API companies who have never heard
