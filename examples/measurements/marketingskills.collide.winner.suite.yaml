    - marketing-skills:ai-seo
- id: collide.product_marketing.positioning
  prompt: Our positioning notes are stale - we now sell to platform teams at API companies,
    not indie developers. Update the shared context that every later session reads first.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    triggered: true
    winner: marketing-skills:product-marketing
    not_triggered:
    - marketing-skills:copywriting
    - marketing-skills:copy-editing
- id: collide.product_marketing.icp
  prompt: We moved from selling to indie developers to selling to platform teams at API companies.
    Work out who our ideal customer is now and how we should position against hand-rolled
    metering, and write it up.
  setup:
    fixtures: ../fixtures/marketing-site
  expect:
    triggered: true
    winner: marketing-skills:product-marketing
    not_triggered:
    - marketing-skills:copywriting
    - marketing-skills:cro
- id: trigger.negative.near_neighbor.pricing_decision
  prompt: Should our Pro plan be $49 or $79 a month? Decide from what is in pricing.html and
