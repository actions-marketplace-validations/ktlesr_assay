    - marketing-skills:cro
- id: trigger.negative.unrelated.slow_query
  prompt: This Postgres query for monthly revenue takes 12 seconds on 4M rows. Work out which
    index it is missing.
  expect:
    triggered: false
    winner: none
    not_triggered:
