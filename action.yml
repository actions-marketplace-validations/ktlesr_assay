# GitHub Actions Marketplace, eylem tanımını deponun KÖKÜNDE arar. Dosya
# `action/action.yml` altındayken eylem `ktlesr/assay/action@v1` ile
# kullanılabiliyordu ama marketplace'e yayımlanamıyordu.
#
# Adımların çalıştırdığı betikler `action/` altında duruyor; `github.action_path`
# deponun kökünü gösterdiği için yollar oradan çözülüyor.
#
# BU EYLEM KENDİ KENDİNE YETER. Önceki hâli çağıranın Assay'i kaynaktan
# derlemiş ve Claude Code'u kurmuş olmasını varsayıyordu — yani yalnızca bu
# depoda çalışıyordu. Artık ikisini de kendi kuruyor ve kimlik bilgisini
# girdi olarak alıyor.

name: Assay — Agent Skill measurement
description: >
  A CI test runner for Agent Skills: does your skill still fire?
author: Assay contributors

branding:
  icon: activity
  color: gray-dark

inputs:
  suite:
    description: Path to the case set (YAML).
    required: true
  skill:
    description: Directory of the skill or plugin under test.
    required: true
  repeat:
    description: Runs per case. Overrides the suite. Never set this to 1 in CI.
    required: false
  model:
    description: Model id override. Leave empty to use the suite's pinned model.
    required: false
  fast:
    description: >
      Early warning, not evidence: 3 attempts per case and the trigger layer
      only. Cases that only declare assertions are not run. Use it on pull
      requests and keep the full run for nightly and pre-release. Needs an
      assay-version that has the flag.
    required: false
    default: 'false'
  allow-unknown:
    description: Treat "nothing could be measured" as success instead of failing.
    required: false
    default: 'false'
  comment:
    description: Post a scorecard as a pull request comment, updating it in place.
    required: false
    default: 'true'
  baseline:
    description: >
      Compare against the newest run stored on the base branch. Requires a
      previous workflow run that uploaded the assay-runs artifact.
    required: false
    default: 'true'
  token:
    description: Token used for the PR comment and for downloading the baseline artifact.
    required: false
    default: ${{ github.token }}

  # --- Kimlik bilgisi -------------------------------------------------------
  # Biri zorunlu. Değer doğrudan alt sürecin ortamına geçer; hiçbir yerde
  # yazdırılmaz. Workflow'da `secrets.*` ile verilmeli.
  anthropic-api-key:
    description: >
      Anthropic API key for the host. Provide this or claude-code-oauth-token.
      Pass it from a secret, never inline.
    required: false
  claude-code-oauth-token:
    description: >
      Claude Code OAuth token (`claude setup-token`). Provide this or
      anthropic-api-key. Pass it from a secret, never inline.
    required: false

  # --- Sürümler -------------------------------------------------------------
  # İkisi de pinli: bir ölçüm aracının kendi sürümü kaymamalı, yoksa "aynı
  # koşullarda ölçüldü" iddiası yalan olur (değişmez #2 ile aynı mantık).
  assay-version:
    description: Version of the @ktlsr/assay CLI to install.
    required: false
    # 0.1.2 `assay scrub` komutunu getirdi; eylem artefaktı yüklemeden önce
    # onu çağırıyor. Daha eski bir sürüm verilirse adım uyarı yazıp geçiyor
    # ve yüklenen kayıtlar maskelenmemiş kalıyor.
    #
    # 0.1.3 ölçülmeyen koşumu her katmanda `unknown` yapıyor: host oturumu
    # açamadığında iş artık 1 ile değil 3 ile çıkıyor. Kimlik bilgisi sorunu
    # kırık skill gibi raporlanmıyor.
    #
    # 0.2.0 tetiklenmeyi aktivasyonun doğrulanmasına bağlıyor: reddedilen bir
    # `Skill` çağrısı artık tetiklenme sayılmıyor ve `unknown` üretiyor. Daha
    # eski bir sürüm verilirse eylem, reddedilen aktivasyonları tetiklenme
    # diye raporlar — sessizce yanlış bir precision.
    #
    # Pin, depo sürümüyle birlikte SÜRÜM PR'ında yükseliyor, yayından önce.
    # Yani birleştirme ile yayın arasında burası npm'de henüz olmayan bir
    # sürümü gösteriyor. Bu pencere kasıtlı ve kısa; sırayı tersine çevirmek
    # pini kalıcı olarak bir sürüm geride bırakırdı.
    default: '0.4.4'
  claude-code-version:
    description: Version of @anthropic-ai/claude-code to install as the host.
    required: false
    default: 'latest'

outputs:
  verdict:
    description: pass, fail or unknown.
    value: ${{ steps.assay.outputs.verdict }}
  run-id:
    description: Identifier of the stored run.
    value: ${{ steps.assay.outputs.run-id }}
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.assay.outputs.report }}

runs:
  using: composite
  steps:
    # Kimlik bilgisi olmadan koşum hiç başlamasın: host oturum açamaz ve
    # sonuç, ölçüm başarısızlığı değil kurulum hatası olur. Erken ve net
    # başarısız olmak, on dakika sonra "unknown" almaktan iyidir.
    - name: Check credentials
      shell: bash
      env:
        API_KEY: ${{ inputs.anthropic-api-key }}
        OAUTH: ${{ inputs.claude-code-oauth-token }}
      run: |
        if [ -z "$API_KEY" ] && [ -z "$OAUTH" ]; then
          echo "::error::Assay needs a host credential. Set either the anthropic-api-key or the claude-code-oauth-token input from a repository secret."
          exit 1
        fi

    - name: Install Assay and the host
      shell: bash
      env:
        ASSAY_VERSION: ${{ inputs.assay-version }}
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
      run: |
        # Yerel derleme varsa (bu deponun kendi dogfood koşumu) o kullanılır ve
        # kurulum atlanır; aksi hâlde yayımlanmış sürüm kurulur.
        if [ -f packages/cli/dist/bin.js ]; then
          echo "using the assay CLI built in this workspace"
        else
          npm install -g "@ktlsr/assay@${ASSAY_VERSION}"
        fi
        npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        claude --version || true

    - name: Fetch baseline
      if: inputs.baseline == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
      run: |
        mkdir -p .assay/baseline
        # En son başarılı koşumun artefaktı; yoksa karşılaştırma atlanır.
        gh run download --repo "$GITHUB_REPOSITORY" --name assay-runs --dir .assay/baseline \
          $(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF" \
              --workflow "$GITHUB_WORKFLOW" --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty') 2>/dev/null \
          || echo "no baseline artifact on $BASE_REF; the comparison will be skipped"

    - name: Run Assay
      id: assay
      shell: bash
      env:
        ASSAY_SUITE: ${{ inputs.suite }}
        ASSAY_SKILL: ${{ inputs.skill }}
        ASSAY_REPEAT: ${{ inputs.repeat }}
        ASSAY_MODEL: ${{ inputs.model }}
        ASSAY_FAST: ${{ inputs.fast }}
        ASSAY_ALLOW_UNKNOWN: ${{ inputs.allow-unknown }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
      run: node "${{ github.action_path }}/action/run.mjs"

    # Maskeleme kayıt yazarken, okurken ve raporda basılırken yapılıyor ama
    # artefakt bir gösterim yüzeyi değil, ham dosya. İndiren herkes JSON'u
    # okuyor; kaçırılan tek kanal buydu.
    - name: Scrub run records before upload
      if: always()
      shell: bash
      run: |
        if [ ! -d .assay/runs ]; then
          exit 0
        fi
        if [ -f packages/cli/dist/bin.js ]; then
          CLI="node packages/cli/dist/bin.js"
        else
          CLI="assay"
        fi
        # `scrub` CLI'a sonradan eklendi. Eski bir sürüm kurulmuşsa komut yok
        # ve adım hata verip işi düşürürdü — ölçüm başarılıyken. Yine de
        # SESSİZCE geçilmiyor: maskeleme gerçek bir koruma ve yokluğu
        # görünmeli, çünkü artefakt herkesin indirebildiği bir dosya.
        if $CLI --help 2>/dev/null | grep -q 'assay scrub'; then
          $CLI scrub .assay/runs
        else
          echo "::warning::This assay CLI has no 'scrub' command, so the uploaded records keep their raw home-directory paths. Set the assay-version input to a release that includes it."
        fi

    - name: Upload report and runs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: assay-runs
        path: |
          .assay/runs
          .assay/report.html
        if-no-files-found: warn

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/action/comment.mjs"
